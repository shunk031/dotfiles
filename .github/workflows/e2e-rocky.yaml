name: Rocky Linux

on:
  push:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/e2e-rocky.yaml"

      # Bootstrap changes affect setup behavior on Rocky Linux.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Rocky install scripts are exercised by the end-to-end job.
      - "install/rocky/**"

      # Linux dispatch templates select Rocky install scripts during setup.
      - "home/.chezmoiscripts/ubuntu/**"

      # Rocky-specific chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/rocky/**"

      # Rocky uses the shared Ubuntu server tmux configuration.
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the end-to-end assertions.
      - "tests/install/rocky/**"
      - "tests/files/**"

  # GitHub Actions does not support YAML anchors, so keep these lists identical.
  pull_request:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/e2e-rocky.yaml"

      # Bootstrap changes affect setup behavior on Rocky Linux.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Rocky install scripts are exercised by the end-to-end job.
      - "install/rocky/**"

      # Linux dispatch templates select Rocky install scripts during setup.
      - "home/.chezmoiscripts/ubuntu/**"

      # Rocky-specific chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/rocky/**"

      # Rocky uses the shared Ubuntu server tmux configuration.
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the end-to-end assertions.
      - "tests/install/rocky/**"
      - "tests/files/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rocky-server:
    # Exercise the Rocky server path in a fresh job container.
    # Dependabot PRs and forked PRs do not receive required repository secrets.
    # Skip this job early instead of failing at the SSH key setup step.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:9
    defaults:
      run:
        shell: bash
    env:
      DOTFILES_SSH_SERVICE_COMMAND: true
      DOTFILES_SYSTEMCTL_COMMAND: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install container prerequisites
        run: |
          set -Eeuo pipefail

          # These tools are present on a stock Rocky install but stripped from the slim image.
          # EPEL supplies the htop package requested by install/rocky/common/dependencies.sh.
          dnf install -y epel-release
          dnf install -y \
            ca-certificates \
            git \
            openssh-clients \
            openssh-server \
            sudo \
            tzdata \
            wget

          # Keep the container timezone aligned with the repository test environment.
          ln -snf /usr/share/zoneinfo/Asia/Tokyo /etc/localtime

          # Run setup.sh as a non-root user with passwordless sudo.
          groupadd dotfiles
          useradd --gid dotfiles --create-home --shell /bin/bash dotfiles
          printf '%s\n' 'dotfiles ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dotfiles
          chmod 0440 /etc/sudoers.d/dotfiles

      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}
          ssh-auth-sock: /tmp/ssh-agent.sock

      - name: Grant the setup user access to the SSH agent
        run: |
          # webfactory/ssh-agent leaves the socket owned by the action user.
          chown dotfiles:dotfiles /tmp/ssh-agent.sock
          chmod 0600 /tmp/ssh-agent.sock

      - name: Setup dotfiles
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: server
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for avoiding rate limit of GitHub API
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          elif [ "${EVENT_NAME}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          export BRANCH_NAME

          URL="https://raw.githubusercontent.com/shunk031/dotfiles/${BRANCH_NAME}/setup.sh"
          echo "Download setup.sh from ${URL}"

          sudo -u dotfiles env \
            BRANCH_NAME="${BRANCH_NAME}" \
            CI=true \
            DOTFILES_SSH_SERVICE_COMMAND="${DOTFILES_SSH_SERVICE_COMMAND}" \
            DOTFILES_SYSTEMCTL_COMMAND="${DOTFILES_SYSTEMCTL_COMMAND}" \
            EMAIL_ADDRESS="${EMAIL_ADDRESS}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            HOME=/home/dotfiles \
            SSH_AUTH_SOCK=/tmp/ssh-agent.sock \
            SYSTEM="${SYSTEM}" \
            bash -c 'printf "%s\n%s\n" "$EMAIL_ADDRESS" "$SYSTEM" | bash -c "$(wget -qO - "$1")"' _ "${URL}"

      - name: Test file existence
        run: |
          sudo -iu dotfiles env HOME=/home/dotfiles bash -lc '
            source "${HOME}/.config/shell/mise.bash"
            cd "$(chezmoi source-path)/../"
            bats tests/files/common.bats
          '
