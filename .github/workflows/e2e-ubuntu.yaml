name: Ubuntu

on:
  push:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/e2e-ubuntu.yaml"

      # Bootstrap changes affect setup behavior on Ubuntu.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "install/common/herdr.sh"
      - "tests/python/test_herdr_integration.py"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Ubuntu install scripts are exercised by the end-to-end jobs.
      - "install/ubuntu/**"

      # Ubuntu chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/ubuntu/**"

      # OS-specific tmux configuration is checked by the end-to-end jobs.
      - "home/dot_tmux.conf.d/os/ubuntu_client.conf"
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the end-to-end assertions.
      - "tests/install/ubuntu/**"
      - "tests/files/**"

  # GitHub Actions does not support YAML anchors, so keep these lists identical.
  pull_request:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/e2e-ubuntu.yaml"

      # Bootstrap changes affect setup behavior on Ubuntu.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "install/common/herdr.sh"
      - "tests/python/test_herdr_integration.py"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Ubuntu install scripts are exercised by the end-to-end jobs.
      - "install/ubuntu/**"

      # Ubuntu chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/ubuntu/**"

      # OS-specific tmux configuration is checked by the end-to-end jobs.
      - "home/dot_tmux.conf.d/os/ubuntu_client.conf"
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the end-to-end assertions.
      - "tests/install/ubuntu/**"
      - "tests/files/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Docker Hub has no Ubuntu Server image: Server and Desktop share one base and differ
  # only by installed metapackages, so both jobs use the official ubuntu image. It is thinner
  # than a real Server install (no systemd), which is what lets it expose missing dependencies.
  ubuntu-client:
    # Exercise the Ubuntu client path in a fresh job container.
    # Dependabot PRs and forked PRs do not receive required repository secrets.
    # Skip this job early instead of failing at the SSH key setup step.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash
    env:
      DOTFILES_SSH_SERVICE_COMMAND: true
      DOTFILES_SYSTEMCTL_COMMAND: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install container prerequisites
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # These tools are present on a stock Ubuntu install but stripped from the slim image.
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            openssh-client \
            sudo \
            tzdata \
            wget

          # Keep tzdata installation non-interactive; setup_timezone.sh configures the timezone.

          # Run setup.sh as a non-root user with passwordless sudo.
          groupadd dotfiles
          useradd --gid dotfiles --create-home --shell /bin/bash dotfiles
          printf '%s\n' 'dotfiles ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dotfiles
          chmod 0440 /etc/sudoers.d/dotfiles

      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}
          ssh-auth-sock: /tmp/ssh-agent.sock

      - name: Grant the setup user access to the SSH agent
        run: |
          # webfactory/ssh-agent leaves the socket owned by the action user.
          chown dotfiles:dotfiles /tmp/ssh-agent.sock
          chmod 0600 /tmp/ssh-agent.sock

      - name: Setup dotfiles
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: client
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for avoiding rate limit of GitHub API
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          elif [ "${EVENT_NAME}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          export BRANCH_NAME

          URL="https://raw.githubusercontent.com/shunk031/dotfiles/${BRANCH_NAME}/setup.sh"
          echo "Download setup.sh from ${URL}"

          sudo -u dotfiles env \
            BRANCH_NAME="${BRANCH_NAME}" \
            CI=true \
            DOTFILES_SSH_SERVICE_COMMAND="${DOTFILES_SSH_SERVICE_COMMAND}" \
            DOTFILES_SYSTEMCTL_COMMAND="${DOTFILES_SYSTEMCTL_COMMAND}" \
            EMAIL_ADDRESS="${EMAIL_ADDRESS}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            HOME=/home/dotfiles \
            SSH_AUTH_SOCK=/tmp/ssh-agent.sock \
            SYSTEM="${SYSTEM}" \
            bash -c 'printf "%s\n%s\n" "$EMAIL_ADDRESS" "$SYSTEM" | bash -c "$(wget -qO - "$1")"' _ "${URL}"

      - name: Verify system configuration
        run: |
          set -Eeuo pipefail
          observed_timezone="$(readlink -f /etc/localtime)"
          observed_timezone_file="$(cat /etc/timezone)"
          printf 'Observed /etc/localtime: %s\n' "${observed_timezone}"
          printf 'Observed /etc/timezone: %s\n' "${observed_timezone_file}"
          test "${observed_timezone}" = "/usr/share/zoneinfo/Asia/Tokyo"
          test "${observed_timezone_file}" = "Asia/Tokyo"

      - name: Test file existence
        env:
          SYSTEM: client
        run: |
          sudo -iu dotfiles env HOME=/home/dotfiles SYSTEM="${SYSTEM}" bash -lc '
            source "${HOME}/.config/shell/mise.bash"
            cd "$(chezmoi source-path)/../"
            bats tests/files/common.bats
            bats \
              --allow-empty-suite \
              --filter-tags common,ubuntu:${SYSTEM} \
              --print-output-on-failure \
              tests/files/ubuntu.bats
          '

  ubuntu-server:
    # Dependabot PRs and forked PRs do not receive required repository secrets.
    # Skip this job early instead of failing at the SSH key setup step.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash
    env:
      DOTFILES_SSH_SERVICE_COMMAND: true
      DOTFILES_SYSTEMCTL_COMMAND: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install container prerequisites
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # These tools are present on a stock Ubuntu install but stripped from the slim image.
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            openssh-client \
            sudo \
            tzdata \
            wget

          # Keep tzdata installation non-interactive; setup_timezone.sh configures the timezone.

          # Run setup.sh as a non-root user with passwordless sudo.
          groupadd dotfiles
          useradd --gid dotfiles --create-home --shell /bin/bash dotfiles
          printf '%s\n' 'dotfiles ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dotfiles
          chmod 0440 /etc/sudoers.d/dotfiles

      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}
          ssh-auth-sock: /tmp/ssh-agent.sock

      - name: Grant the setup user access to the SSH agent
        run: |
          # webfactory/ssh-agent leaves the socket owned by the action user.
          chown dotfiles:dotfiles /tmp/ssh-agent.sock
          chmod 0600 /tmp/ssh-agent.sock

      - name: Setup dotfiles
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: server
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for avoiding rate limit of GitHub API
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          elif [ "${EVENT_NAME}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          export BRANCH_NAME

          URL="https://raw.githubusercontent.com/shunk031/dotfiles/${BRANCH_NAME}/setup.sh"
          echo "Download setup.sh from ${URL}"

          sudo -u dotfiles env \
            BRANCH_NAME="${BRANCH_NAME}" \
            CI=true \
            DOTFILES_SSH_SERVICE_COMMAND="${DOTFILES_SSH_SERVICE_COMMAND}" \
            DOTFILES_SYSTEMCTL_COMMAND="${DOTFILES_SYSTEMCTL_COMMAND}" \
            EMAIL_ADDRESS="${EMAIL_ADDRESS}" \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            HOME=/home/dotfiles \
            SSH_AUTH_SOCK=/tmp/ssh-agent.sock \
            SYSTEM="${SYSTEM}" \
            bash -c 'printf "%s\n%s\n" "$EMAIL_ADDRESS" "$SYSTEM" | bash -c "$(wget -qO - "$1")"' _ "${URL}"

      - name: Verify system configuration
        run: |
          set -Eeuo pipefail
          observed_timezone="$(readlink -f /etc/localtime)"
          observed_timezone_file="$(cat /etc/timezone)"
          printf 'Observed /etc/localtime: %s\n' "${observed_timezone}"
          printf 'Observed /etc/timezone: %s\n' "${observed_timezone_file}"
          test "${observed_timezone}" = "/usr/share/zoneinfo/Asia/Tokyo"
          test "${observed_timezone_file}" = "Asia/Tokyo"

      - name: Test file existence
        env:
          SYSTEM: server
        run: |
          sudo -iu dotfiles env HOME=/home/dotfiles SYSTEM="${SYSTEM}" bash -lc '
            source "${HOME}/.config/shell/mise.bash"
            cd "$(chezmoi source-path)/../"
            bats tests/files/common.bats
            bats \
              --allow-empty-suite \
              --filter-tags common,ubuntu:${SYSTEM} \
              --print-output-on-failure \
              tests/files/ubuntu.bats
          '
