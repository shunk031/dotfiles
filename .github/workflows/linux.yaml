name: Linux

on:
  push:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/linux.yaml"

      # Bootstrap changes affect setup behavior on both Linux distributions.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Distribution install scripts are exercised by the build job.
      - "install/ubuntu/**"
      - "install/rocky/**"

      # Distribution-specific chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/ubuntu/**"
      - "home/.chezmoiscripts/rocky/**"

      # OS-specific tmux configuration is checked by the build job.
      - "home/dot_tmux.conf.d/os/ubuntu_client.conf"
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the build's assertions.
      - "tests/install/ubuntu/**"
      - "tests/install/rocky/**"
      - "tests/files/**"

  # GitHub Actions does not support YAML anchors, so keep these lists identical.
  pull_request:
    branches: [main]
    paths:
      # Run this workflow when its definition changes.
      - ".github/workflows/linux.yaml"

      # Bootstrap changes affect setup behavior on both Linux distributions.
      - "setup.sh"
      - "home/dot_mise/config.toml"
      - "install/common/mise.sh"
      - "home/.chezmoiscripts/common/run_once_after_02-install-mise.sh.tmpl"
      - "home/.chezmoiscripts/common/run_after_20-install-mise-tools.sh.tmpl"

      # Distribution install scripts are exercised by the build job.
      - "install/ubuntu/**"
      - "install/rocky/**"

      # Distribution-specific chezmoi scripts are applied during setup.
      - "home/.chezmoiscripts/ubuntu/**"
      - "home/.chezmoiscripts/rocky/**"

      # OS-specific tmux configuration is checked by the build job.
      - "home/dot_tmux.conf.d/os/ubuntu_client.conf"
      - "home/dot_tmux.conf.d/os/ubuntu_server.conf"

      # Installation and file-existence tests define the build's assertions.
      - "tests/install/ubuntu/**"
      - "tests/install/rocky/**"
      - "tests/files/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Dependabot PRs and forked PRs do not receive required repository secrets.
    # Skip this job early instead of failing at the SSH key setup step.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    strategy:
      matrix:
        system: [server, client]

    runs-on: ubuntu-latest
    env:
      DOTFILES_DEBUG: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}

      - name: Setup dotfiles
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: ${{ matrix.system }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for avoiding rate limit of GitHub API
        run: |
          if [ "${EVENT_NAME}" == "push" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          elif [ "${EVENT_NAME}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          fi
          export BRANCH_NAME

          URL="https://raw.githubusercontent.com/shunk031/dotfiles/${BRANCH_NAME}/setup.sh"
          echo "Download setup.sh from ${URL}"

          printf "${EMAIL_ADDRESS}\n${SYSTEM}\n" | bash -c "$(wget -qO - $URL)"
          #              │               │
          #              │               └─ Simulate inputting an system arcitecture into the config.
          #              └─ Simulate inputting an email address into the config.

      # - name: Install latest bats-core
      #   run: |
      #     tmp_dir=$(mktemp -d /tmp/bats-core-XXXXX)
      #     git clone --depth 1 https://github.com/bats-core/bats-core.git "${tmp_dir}"
      #     cd "${tmp_dir}"
      #     sudo ./install.sh /usr/local
      #     rm -rf "${tmp_dir}"

      - name: Test file existence
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          source "${HOME}/.config/shell/mise.bash"
          cd $(chezmoi source-path)/../
          bats tests/files/common.bats
          bats --allow-empty-suite \
            --filter-tags common,ubuntu:${SYSTEM} \
            --print-output-on-failure \
            tests/files/ubuntu.bats
