name: Snippet install

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 5"

jobs:
  macos:
    # Snippet install also depends on private dotfiles repo credentials.
    # Skip known secret-less contexts to avoid failing at SSH key setup.
    if: ${{ github.actor != 'dependabot[bot]' }}
    timeout-minutes: 15
    runs-on: macos-14
    env:
      # DOTFILES_DEBUG: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}

      - name: Setup dotfiles with snippet
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: |
          printf "${EMAIL_ADDRESS}\n" | bash -c "$(curl -fsLS https://shunk031.me/dotfiles/setup.sh)"
          #              │
          #              └─ Simulate inputting an email address into the chezmoi's config.

  ubuntu-client:
    # Snippet install also depends on private dotfiles repo credentials.
    # Skip known secret-less contexts to avoid failing at SSH key setup.
    if: ${{ github.actor != 'dependabot[bot]' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # DOTFILES_DEBUG: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}

      - name: Setup dotfiles with snippet
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: client
        run: |
          printf "${EMAIL_ADDRESS}\n${SYSTEM}\n" | bash -c "$(wget -qO - https://shunk031.me/dotfiles/setup.sh)"
          #              │               │
          #              │               └─ Simulate inputting an system arcitecture into the config.
          #              └─ Simulate inputting an email address into the config.

  ubuntu-server:
    # Snippet install also depends on private dotfiles repo credentials.
    # Skip known secret-less contexts to avoid failing at SSH key setup.
    if: ${{ github.actor != 'dependabot[bot]' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # DOTFILES_DEBUG: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Set up SSH agent and add the private deploy key for the private dotfiles repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_DOTFILES_PRIVATE_DEPLOY_KEY }}

      - name: Setup dotfiles with snippet
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          SYSTEM: server
        run: |
          printf "${EMAIL_ADDRESS}\n${SYSTEM}\n" | bash -c "$(wget -qO - https://shunk031.me/dotfiles/setup.sh)"
          #              │               │
          #              │               └─ Simulate inputting an system arcitecture into the config.
          #              └─ Simulate inputting an email address into the config.
