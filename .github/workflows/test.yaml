name: Unit test

on:
  # Required checks must always report a final status for PRs into `main`.
  # Do not add workflow-level path filters here: GitHub can leave skipped
  # required checks in a pending state and block merges.
  # Keep this workflow unconditional and decide inside jobs whether the full
  # test matrix is necessary for the current diff.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.should_test }}
      diff_range: ${{ steps.filter.outputs.diff_range }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect unit-test-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Keep the diff calculation here so the required workflow can always
          # start and report a final status before we decide whether to run the
          # heavier test steps.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            diff_range="origin/${BASE_REF}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${BEFORE_SHA}...${HEAD_SHA}"
          else
            diff_range="${HEAD_SHA}^...${HEAD_SHA}"
          fi

          echo "diff_range=${diff_range}" >> "${GITHUB_OUTPUT}"

          # One option would be to predefine CI-relevant path groups such as
          # `.github/workflows/`, `home/`, `install/`, and `tests/` in an env-
          # var-like form to make the rule reusable. For this workflow, keeping
          # the pattern inline is still easier to read because the rule is only
          # used once and only decides whether the expensive unit-test steps
          # should run. It does not decide whether the required workflow itself
          # reports a status. If more workflows need the same rule later,
          # extract a shared script instead of hiding the pattern in env.
          if git diff --name-only "${diff_range}" | grep -Eq '^(\.github/workflows/|\.pre-commit-config\.yaml$|Makefile$|home/|install/|scripts/|tests/)'; then
            echo "should_test=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_test=false" >> "${GITHUB_OUTPUT}"
          fi

  test:
    needs: changes
    # Run the same test suite on each target OS/system pair.
    # We intentionally keep macOS as `client` only because this repository
    # does not define a macOS `server` test target.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        system: [client, server]
        exclude:
          - os: macos-14
            system: server

    runs-on: ${{ matrix.os }}
    env:
      # Export matrix values to shell scripts so existing test helpers can use
      # simple `OS`/`SYSTEM` checks without depending on GitHub expression syntax.
      OS: ${{ matrix.os }}
      TARGET_OS: ${{ matrix.os }}
      SYSTEM: ${{ matrix.system }}
      # Keep Codecov naming deterministic per job. This makes it easy to trace
      # upload sessions in Codecov API/UI and avoids accidental session overlap.
      CODECOV_FLAGS: ${{ matrix.os }}-${{ matrix.system }}
      CODECOV_NAME: codecov-dotfiles-${{ matrix.os }}-${{ matrix.system }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip full unit test run for unrelated changes
        if: ${{ needs.changes.outputs.should_test != 'true' }}
        run: |
          echo "No unit-test-relevant files changed."
          echo "Compared diff range: ${{ needs.changes.outputs.diff_range }}"

      - name: Install tools
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          if [ "${OS}" == "macos-14" ]; then
            # `bashcov` on macOS must use Homebrew Bash (>=5) to avoid the
            # system Bash 3.2 parser limitations that produced empty coverage.
            brew install bash bats-core parallel

          elif [ "${OS}" == "ubuntu-latest" ]; then
            # Ruby is required for bashcov/simplecov formatters.
            sudo apt-get update && sudo apt-get install -y bats parallel ruby

          else
            echo "${OS} and ${SYSTEM} are not supported" >&2
            exit 1
          fi

          # Install coverage tooling as user gems and expose gem bin dir on PATH.
          # `--no-document` keeps CI faster and deterministic.
          gem install --user-install --no-document bashcov simplecov-cobertura
          echo "$(ruby -r rubygems -e 'puts Gem.user_dir')/bin" >> "${GITHUB_PATH}"

      - name: Run `shfmt`
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        uses: reviewdog/action-shfmt@v1
        with:
          shfmt_flags: -i 4 -sr -d

      - name: Run Python unit tests
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: python3 -m unittest discover -s tests/python

      - name: Run unit test
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Shared bashcov defaults:
          # - `--skip-uncovered`: limit report to executed files.
          # - `--root .`: normalize paths relative to repository root.
          bashcov_args=(--skip-uncovered --root .)
          if [ "${OS}" == "macos-14" ]; then
            # Force Homebrew Bash for tracing on macOS; this solved the
            # previously observed `Line Coverage: 100.0% (0 / 0)` issue.
            bashcov_args+=(--bash-path /opt/homebrew/bin/bash)
          fi

          # Use a unique command name per matrix job so SimpleCov keeps each
          # session separated before Codecov merges by flag/name.
          BASHCOV_COMMAND_NAME="unit-test-${OS}-${SYSTEM}" \
            bashcov "${bashcov_args[@]}" -- ./scripts/run_unit_test.sh

      - name: Setup for codecov
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          # codecov-action requires these tools for uploader validation/signing
          # in this repository setup.
          if [ "${OS}" == "macos-14" ]; then
            brew install gpg jq curl

          elif [ "${OS}" == "ubuntu-latest" ]; then
            sudo apt-get install -y gpg jq curl

          else
            echo "${OS} and ${SYSTEM} are not supported" >&2
            exit 1
          fi

      - name: Check coverage report
        id: coverage-report
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          if [ -f ./coverage/coverage.xml ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::coverage/coverage.xml was not generated; skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' && steps.coverage-report.outputs.exists == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          # Upload only the explicit report file generated in this workflow.
          # This prevents unexpected auto-discovery from old/temporary files.
          disable_search: true
          env_vars: OS,SYSTEM
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          verbose: true

  container:
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    strategy:
      matrix:
        include:
          - target_os: ubuntu
            image: ubuntu:26.04
          - target_os: rocky
            image: rockylinux/rockylinux:9

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.target_os }}
      TARGET_OS: ${{ matrix.target_os }}
      SYSTEM: server
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_FLAGS: container-${{ matrix.target_os }}
      CODECOV_NAME: codecov-dotfiles-container-${{ matrix.target_os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install test tools
        run: |
          set -Eeuo pipefail

          if [ "${TARGET_OS}" = "ubuntu" ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              bats \
              curl \
              gpg \
              jq \
              parallel \
              python3 \
              ruby \
              shfmt \
              sudo \
              util-linux
            bash ./install/ubuntu/common/dependencies.sh
          elif [ "${TARGET_OS}" = "rocky" ]; then
            dnf install -y epel-release
            dnf install -y bats jq parallel python3 ruby util-linux
            bash ./install/rocky/common/dependencies.sh
            rpm -q pinentry
            test "$(command -v pinentry-curses)" = "/usr/bin/pinentry-curses"

            # EPEL 9 does not provide shfmt, so install the repository-pinned
            # upstream release and verify its published digest.
            shfmt_path=/usr/local/bin/shfmt
            curl --fail --location --silent --show-error \
              "https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64" \
              --output "${shfmt_path}"
            printf '%s  %s\n' \
              fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66 \
              "${shfmt_path}" | sha256sum --check --status -
            chmod 755 "${shfmt_path}"
          else
            echo "${TARGET_OS} is not supported" >&2
            exit 1
          fi

          gem install --no-document bashcov simplecov-cobertura

      - name: Prepare non-root test user
        run: |
          set -Eeuo pipefail

          useradd --create-home --shell /bin/bash bats
          test_bin="$(mktemp -d)"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            '# @file ci/fake-sudo' \
            '# @brief Execute a command without privilege escalation.' \
            '# @description' \
            '#   Removes the environment-preservation option used by install scripts.' \
            'if [[ "${1:-}" == --preserve-env=* ]]; then' \
            '    shift' \
            'fi' \
            'exec "$@"' > "${test_bin}/sudo"
          chmod 755 "${test_bin}" "${test_bin}/sudo"
          chown -R bats:bats "${GITHUB_WORKSPACE}"
          printf 'TEST_BIN=%s\n' "${test_bin}" >> "${GITHUB_ENV}"

      - name: Run `shfmt`
        run: shfmt -i 4 -sr -d .

      - name: Run Python unit tests
        run: |
          setpriv --reuid=bats --regid=bats --init-groups \
            env "PATH=${TEST_BIN}:${PATH}" \
            python3 -m unittest discover -s tests/python

      - name: Run shell unit tests with coverage
        run: |
          setpriv --reuid=bats --regid=bats --init-groups \
            env \
            "PATH=${TEST_BIN}:${PATH}" \
            "BASHCOV_COMMAND_NAME=unit-test-container-${TARGET_OS}" \
            bashcov --skip-uncovered --root . -- ./scripts/run_unit_test.sh

      - name: Check coverage report
        id: coverage-report
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: |
          if [ -f ./coverage/coverage.xml ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::coverage/coverage.xml was not generated; skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && steps.coverage-report.outputs.exists == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          disable_search: true
          env_vars: OS,SYSTEM
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          verbose: true
