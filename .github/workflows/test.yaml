name: Unit test

on:
  # Required checks must always report a final status for PRs into `main`.
  # Do not add workflow-level path filters here: GitHub can leave skipped
  # required checks in a pending state and block merges.
  # Keep this workflow unconditional and decide inside jobs whether the full
  # test matrix is necessary for the current diff.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.should_test }}
      diff_range: ${{ steps.filter.outputs.diff_range }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect unit-test-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Keep the diff calculation here so the required workflow can always
          # start and report a final status before we decide whether to run the
          # heavier test steps.
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            diff_range="origin/${BASE_REF}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${BEFORE_SHA}...${HEAD_SHA}"
          else
            diff_range="${HEAD_SHA}^...${HEAD_SHA}"
          fi

          echo "diff_range=${diff_range}" >> "${GITHUB_OUTPUT}"

          # One option would be to predefine CI-relevant path groups such as
          # `.github/workflows/`, `home/`, `install/`, and `tests/` in an env-
          # var-like form to make the rule reusable. For this workflow, keeping
          # the pattern inline is still easier to read because the rule is only
          # used once and only decides whether the expensive unit-test steps
          # should run. It does not decide whether the required workflow itself
          # reports a status. If more workflows need the same rule later,
          # extract a shared script instead of hiding the pattern in env.
          if git diff --name-only "${diff_range}" | grep -Eq '^(\.github/workflows/|\.pre-commit-config\.yaml$|Makefile$|home/|install/|scripts/|tests/)'; then
            echo "should_test=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_test=false" >> "${GITHUB_OUTPUT}"
          fi

  macos:
    needs: changes
    # Run unit tests on the macOS runner because GitHub Actions does not
    # support macOS job containers.
    runs-on: macos-14
    env:
      # Keep the target label aligned with the existing macOS runner.
      OS: macos-14
      TARGET_OS: macos-14
      CODECOV_FLAGS: macos
      CODECOV_NAME: codecov-dotfiles-macos
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip full unit test run for unrelated changes
        if: ${{ needs.changes.outputs.should_test != 'true' }}
        run: |
          # Keep this required job reporting a final status for every PR.
          echo "No unit-test-relevant files changed."
          echo "Compared diff range: ${{ needs.changes.outputs.diff_range }}"

      - name: Install test tools
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Homebrew Bash avoids the system Bash 3.2 parser limitations.
          brew install bash

          # Bats and parallel are required by the shell test harness.
          brew install bats-core parallel

      - name: Install coverage tooling
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # User gems keep bashcov available without modifying system Ruby.
          gem install --user-install --no-document bashcov simplecov-cobertura

          # Expose the user gem executables to later steps.
          echo "$(ruby -r rubygems -e 'puts Gem.user_dir')/bin" >> "${GITHUB_PATH}"

          # Codecov uses these tools for uploader validation and signing.
          brew install gpg jq curl

      - name: Run Python unit tests
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: python3 -m unittest discover -s tests/python

      - name: Run shell unit tests with coverage
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Force Homebrew Bash for tracing on macOS.
          bashcov_args=(--skip-uncovered --root . --bash-path /opt/homebrew/bin/bash)

          # Keep the coverage session name distinct from the Linux jobs.
          BASHCOV_COMMAND_NAME="unit-test-${TARGET_OS}" \
            bashcov "${bashcov_args[@]}" -- ./scripts/run_unit_test.sh

      - name: Check coverage report
        id: coverage-report
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          # Upload only the report generated by this job.
          if [ -f ./coverage/coverage.xml ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::coverage/coverage.xml was not generated; skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' && steps.coverage-report.outputs.exists == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          # Upload only the explicit report file generated in this workflow.
          # This prevents unexpected auto-discovery from old or temporary files.
          disable_search: true
          env_vars: OS,TARGET_OS
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          verbose: true

  ubuntu:
    needs: changes
    # Run Ubuntu unit tests inside the official image so runner-preinstalled
    # tools cannot mask missing dependencies.
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    env:
      # Keep Codecov metadata tied to this distribution-specific job.
      OS: ubuntu
      TARGET_OS: ubuntu
      CODECOV_FLAGS: ubuntu
      CODECOV_NAME: codecov-dotfiles-ubuntu
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Skip full unit test run for unrelated changes
        if: ${{ needs.changes.outputs.should_test != 'true' }}
        run: |
          # Keep this required job reporting a final status for every PR.
          echo "No unit-test-relevant files changed."
          echo "Compared diff range: ${{ needs.changes.outputs.diff_range }}"

      - name: Install test tools
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          set -Eeuo pipefail

          # Install the tools used directly by the test harness.
          # Noninteractive mode prevents package prompts from blocking CI.
          export DEBIAN_FRONTEND=noninteractive

          # Refresh the official image's package metadata before installing.
          apt-get update
          apt-get install -y --no-install-recommends \
            bats \
            ca-certificates \
            curl \
            gpg \
            jq \
            parallel \
            python3 \
            ruby \
            sudo \
            util-linux

      - name: Install GitHub CLI
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Follow the official GitHub CLI Debian installation instructions.
          # The keyring lets APT verify packages from the GitHub CLI repository.
          install -d -m 0755 /etc/apt/keyrings
          curl --fail --location --silent --show-error \
            https://cli.github.com/packages/githubcli-archive-keyring.gpg |
            gpg --dearmor --yes --output /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg

          # Register and install the GitHub CLI package.
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main\n' \
            "$(dpkg --print-architecture)" |
            tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update

          # Install the GitHub CLI after its repository is registered.
          apt-get install -y --no-install-recommends gh

      - name: Run the Ubuntu dependency script
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Exercise the same dependency path used by a real Ubuntu install.
          bash ./install/ubuntu/common/dependencies.sh

      - name: Install coverage tooling
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Install bashcov and its Cobertura formatter for shell coverage.
          gem install --no-document bashcov simplecov-cobertura

          # Expose the gem executables to later steps.
          echo "$(ruby -r rubygems -e 'puts Gem.user_dir')/bin" >> "${GITHUB_PATH}"

      - name: Run `shfmt`
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        uses: reviewdog/action-shfmt@v1
        with:
          # Run the distribution-independent formatter once in the Ubuntu job.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          shfmt_flags: -i 4 -sr -d

      - name: Run Python unit tests
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Keep Python coverage independent from the shell test harness.
          python3 -m unittest discover -s tests/python

      - name: Run shell unit tests with coverage
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Keep the coverage session name distinct from the other OS jobs.
          # Skip files that are not reached by the selected Bats suites.
          BASHCOV_COMMAND_NAME="unit-test-${TARGET_OS}" \
            bashcov --skip-uncovered --root . -- ./scripts/run_unit_test.sh

      - name: Check coverage report
        id: coverage-report
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          # Upload only the report generated by this job.
          # Missing coverage is a warning because the test result remains valid.
          if [ -f ./coverage/coverage.xml ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::coverage/coverage.xml was not generated; skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' && steps.coverage-report.outputs.exists == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          # Upload only the explicit report file generated in this workflow.
          # This prevents unexpected auto-discovery from old or temporary files.
          disable_search: true
          env_vars: OS,TARGET_OS
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          verbose: true

  rocky:
    needs: changes
    # Run Rocky Linux unit tests inside the official image so runner-
    # preinstalled tools cannot mask missing dependencies.
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    defaults:
      run:
        shell: bash
    env:
      # Keep Codecov metadata tied to this distribution-specific job.
      OS: rocky
      TARGET_OS: rocky
      CODECOV_FLAGS: rocky
      CODECOV_NAME: codecov-dotfiles-rocky
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Skip full unit test run for unrelated changes
        if: ${{ needs.changes.outputs.should_test != 'true' }}
        run: |
          # Keep this required job reporting a final status for every PR.
          echo "No unit-test-relevant files changed."
          echo "Compared diff range: ${{ needs.changes.outputs.diff_range }}"

      - name: Install EPEL and GitHub CLI repository
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          set -Eeuo pipefail

          # EPEL must be enabled before one transaction resolves Bats; the
          # GitHub CLI repository must be present before that same transaction
          # resolves gh.
          dnf install -y epel-release

          # Download the official repository definition without another DNF transaction.
          curl --fail --silent --show-error --location \
            https://cli.github.com/packages/rpm/gh-cli.repo \
            --output /etc/yum.repos.d/gh-cli.repo

      - name: Install Rocky test tools
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Install all image-missing test tools in one transaction.
          dnf install -y \
            bats \
            gh \
            jq \
            parallel \
            python3 \
            ruby \
            sudo \
            util-linux

      - name: Run the Rocky Linux dependency script
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Exercise the same dependency path used by a real Rocky install.
          bash ./install/rocky/common/dependencies.sh

      - name: Verify pinentry
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # The Rocky GPG tests require the terminal pinentry implementation.
          rpm -q pinentry
          test "$(command -v pinentry-curses)" = "/usr/bin/pinentry-curses"

      - name: Install coverage tooling
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Install bashcov and its Cobertura formatter for shell coverage.
          gem install --no-document bashcov simplecov-cobertura

          # Expose the gem executables to later steps.
          echo "$(ruby -r rubygems -e 'puts Gem.user_dir')/bin" >> "${GITHUB_PATH}"

      - name: Run Python unit tests
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Keep Python coverage independent from the shell test harness.
          python3 -m unittest discover -s tests/python

      - name: Run shell unit tests with coverage
        if: ${{ needs.changes.outputs.should_test == 'true' }}
        run: |
          # Keep the coverage session name distinct from the other OS jobs.
          BASHCOV_COMMAND_NAME="unit-test-${TARGET_OS}" \
            bashcov --skip-uncovered --root . -- ./scripts/run_unit_test.sh

      - name: Check coverage report
        id: coverage-report
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' }}
        run: |
          # Upload only the report generated by this job.
          if [ -f ./coverage/coverage.xml ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::coverage/coverage.xml was not generated; skipping Codecov upload."
          fi

      - name: Upload coverage to Codecov
        if: ${{ needs.changes.outputs.should_test == 'true' && github.actor != 'dependabot[bot]' && steps.coverage-report.outputs.exists == 'true' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage.xml
          # Upload only the explicit report file generated in this workflow.
          # This prevents unexpected auto-discovery from old or temporary files.
          disable_search: true
          env_vars: OS,TARGET_OS
          fail_ci_if_error: true
          flags: ${{ env.CODECOV_FLAGS }}
          name: ${{ env.CODECOV_NAME }}
          verbose: true
