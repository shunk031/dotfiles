#
# Path and Fpath for Client Machine
#

[plugins.client-path]
inline = '''
function _client_path() {
    typeset -gU path fpath
    path=(
        $path
        ${HOME}/.local/bin/client(N-/)
    )
    fpath=(
        $fpath
        ${HOME}/.local/bin/client(N-/)
    )
}
zsh-defer _client_path
'''

#
# Prompt for Client Machine
#

[plugins.mise]
# Keep full activation on clients so per-project [env] and exact PATH work; measured on a Docker Ubuntu host on 2026-09-13, real client input was ready in about 2 ms after the first prompt.
# Accept the measured 6-7 ms hook cost; p10k did not hide it (starship +6 ms, p10k +7 ms).
inline = 'mise_zsh_activate client'

[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"

[plugins.p10k]
local = "~/.config/powerlevel10k"
use = ["p10k.zsh"]
apply = ["source"]

#
# Alias for Client Machine
#

[plugins.alias]
local = '~/.config/alias'
use = ['client.sh']
apply = ['source']

#
# git related plugins
#

[plugins.git-open]
github = "paulirish/git-open"
apply = ["defer"]
