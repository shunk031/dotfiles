#
#  Path and Fpath for Server Machine
#

[plugins.server-path]
inline = '''
function _server_path() {
    typeset -gU path fpath

    path=(
        $path
        ${HOME}/.local/bin/server(N-/)
    )
    fpath=(
        $fpath
        ${HOME}/.local/bin/server(N-/)
    )
}
zsh-defer _server_path
'''

#
# Mise for managing multiple versions of tools
#

[plugins.mise]
# Keep servers on shims-only activation: this is a startup/per-prompt trade-off, not a prompt-framework interaction.
# Measured on a Docker Ubuntu host on 2026-09-13, full activation cost about 40 ms at startup and 6-7 ms per prompt versus about 2 ms at startup and none per prompt for shims.
# Servers accept losing mise's per-project [env] auto-export for that saving.
inline = 'mise_zsh_activate server'

#
# Prompt for Server Machine
#

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

#
# Alias for Server Machine
#

[plugins.alias]
local = '~/.config/alias'
use = ['server.sh']
apply = ['source']

#
#
#

[plugins.cuda]
local = '~/.local/bin/server'
use = ['cuda.sh']
apply = ['source']

[plugins.ssh-agent]
local = "~/.local/bin/server"
use = ['ssh_agent.sh']
apply = ['source']

[plugins.chezmoi-notify]
local = "~/.config/zsh/plugins/chezmoi-notify"
