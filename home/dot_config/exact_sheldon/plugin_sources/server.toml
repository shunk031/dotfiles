#
#  Path and Fpath for Server Machine
#

[plugins.server-path]
inline = '''
function _server_path() {
    typeset -gU path fpath

    path=(
        $path
        ${HOME}/.local/bin/server(N-/)
    )
    fpath=(
        $fpath
        ${HOME}/.local/bin/server(N-/)
    )
}
zsh-defer _server_path
'''

#
# Mise for managing multiple versions of tools
#

[plugins.mise]
# Servers use shims-only activation: measured full activation costs ~40 ms at startup and ~6-7 ms per prompt (same on starship and p10k), shims cost ~2 ms at startup and nothing per prompt.
# The price is that mise's per-project [env] auto-export does not apply on servers.
inline = 'mise_zsh_activate server'

#
# Prompt for Server Machine
#

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

#
# Alias for Server Machine
#

[plugins.alias]
local = '~/.config/alias'
use = ['server.sh']
apply = ['source']

#
#
#

[plugins.cuda]
local = '~/.local/bin/server'
use = ['cuda.sh']
apply = ['source']

[plugins.ssh-agent]
local = "~/.local/bin/server"
use = ['ssh_agent.sh']
apply = ['source']

[plugins.chezmoi-notify]
local = "~/.config/zsh/plugins/chezmoi-notify"
