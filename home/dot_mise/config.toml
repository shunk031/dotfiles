# Minimum mise version compatible with this dotfiles configuration.
# Raise this only when a configuration or tool change requires newer mise behavior.
# Declarative system bootstrap and automatic dangling npm install repair require mise 2026.8.15 or newer.
min_version = "2026.8.15"

[tools]
# Keep each group sorted by package name, ignoring backend prefixes and leading `@`.

# Language runtimes
go = "1.27.0"
node = "lts"
python = "3.14.6"
ruby = "4.0.6"
rust = "1.98.0"

# CLI tools
bun = "1.4.0"
eza = "0.23.5"
fnox = "1.34.1"
gcloud = "575.0.0"
herdr = "0.9.0"
sqlite = "3.53.4"

# Aqua tools
"aqua:FiloSottile/age" = "1.3.2"
"aqua:google-antigravity/antigravity-cli" = "1.1.27"
"aqua:aws/aws-cli" = "2.36.35"
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:twpayne/chezmoi" = "2.72.1"
"aqua:anthropics/claude-code" = "2.1.263"
"aqua:openai/codex" = "0.153.4"
"aqua:dotenvx/dotenvx" = "2.23.0"
"aqua:bootandy/dust" = "1.2.5"
"aqua:sharkdp/fd" = "10.5.0"
"aqua:cli/cli" = "2.98.0"
"aqua:x-motemen/ghq" = "1.10.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:j178/prek" = "0.5.0"
"aqua:ahmetb/kubectx" = "0.11.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.0"
"aqua:astral-sh/uv" = "0.12.7"
"aqua:sxyazi/yazi" = "26.8.15"
"aqua:mikefarah/yq" = "4.53.6"

# Cargo tools
"cargo:pueue" = "4.0.4"

# Go tools
#
# Shuhari ships no git tags, so its module version list is empty and mise
# cannot resolve `latest`. This pins the module-proxy pseudo-version of a
# specific `main` commit; replace it with a semantic version once one exists.
"go:github.com/shunk031/shuhari/cmd/shuhari" = "0.0.0-20260824171335-deb972da670a"

# GitHub release tools
"github:d-kuro/gwq" = "0.1.1"
"github:shuntaka9576/blocc" = { version = "0.6.0", os = ["linux"] }

# npm tools
"npm:bash-language-server" = "5.6.0"
"npm:fast-cli" = "5.2.0"
"npm:pyright" = "1.1.413"
"npm:skills" = "1.5.23"

# textlint tools
"npm:@cffnpwr/textlint-rule-no-arbitrary-line-break" = "1.1.0"
"npm:textlint" = "15.8.0"
"npm:textlint-rule-ja-space-between-half-and-full-width" = "3.0.3"

[settings]
# Version files: honor idiomatic files such as `.python-version`.
idiomatic_version_file_enable_tools = ["python"]

# Release policy: wait before adopting new releases, except for fast-moving agent CLIs.
minimum_release_age = "7d"
# Keep this list identical to the `agent tooling` group in `.github/renovate.json`:
# that group pins on release day, so anything Renovate lists there but that is missing
# here stays refused until the cutoff passes. `fnox` is intentionally absent — it stores
# credentials, so it keeps the cooling-off period, which signature verification cannot
# replace.
minimum_release_age_excludes = [
  "herdr",
  "aqua:anthropics/claude-code",
  "aqua:google-antigravity/antigravity-cli",
  "aqua:openai/codex",
]

# Language runtimes: install precompiled binaries only; never build from source.
[settings.python]
compile = false

[settings.ruby]
compile = false
